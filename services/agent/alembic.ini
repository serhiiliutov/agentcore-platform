# ============================================================================
# Alembic configuration for the agent service.
#
# The database URL is deliberately NOT set here. It comes from the environment via
# `alembic/env.py`, so migrations always run against the same database the service
# uses and there is no second place a connection string can drift. `devtasks migrate`
# runs this with the service directory as the working directory.
# ============================================================================

[alembic]
script_location = alembic
prepend_sys_path = src

# Migration files are named `0001_baseline.py`-style: a zero-padded sequence, then
# the slug. `%d` from alembic's own revision ids is opaque, and a directory listing
# that reads as a history is worth more than one that reads as hashes.
file_template = %%(rev)s_%%(slug)s

# No `timezone` setting here on purpose. Alembic resolves it through the host's tz
# database to stamp the generated file's date, and on Windows it fails with
# "Can't locate timezone" for names that work fine on Linux. It affects nothing but a
# comment in a generated file, so the portable choice is to omit it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
